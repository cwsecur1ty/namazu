[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namazu-api"
version = "0.1.0"
description = "An API security workbench for OpenAPI contracts: contract testing and an OWASP API Top 10 audit with reproducible evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cwsecur1ty" }]
keywords = [
  "api-security", "openapi", "swagger", "owasp", "pentest",
  "security-testing", "dast", "api-testing", "bola", "oauth2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "PyYAML>=6,<7", "jsonschema>=4.23,<5", "referencing>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/cwsecur1ty/namazu"
Repository = "https://github.com/cwsecur1ty/namazu"
Issues = "https://github.com/cwsecur1ty/namazu/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]
# Optional second-opinion tooling. nuclei is a Go binary and is installed separately.
external = ["schemathesis>=4,<5"]

[project.scripts]
namazu = "namazu.__main__:main"

[tool.setuptools.packages.find]
include = ["namazu*"]

[tool.setuptools.package-data]
namazu = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Correctness and modernisation, not formatting. Line length is deliberately
# unenforced: the advisory prose in the catalogue reads better as long lines
# than as something wrapped to please a linter.
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The advisories use typographic quotes and dashes on purpose. A finding is
    # read by a person, so the prose is punctuated for a person.
    "RUF001", "RUF002", "RUF003",
    # Guard-clause chains stay as chains. Several of them carry a comment
    # explaining one specific condition, and merging the conditions moves the
    # comment away from the thing it explains.
    "SIM102", "SIM103",
    # A nested with, where the inner context manager is built from the outer
    # one, says that dependency out loud. A combined with hides it.
    "SIM117",
    # Concatenation and unpacking are equally clear here, so this one is taste
    # rather than correctness.
    "RUF005",
]

[tool.ruff.lint.per-file-ignores]
# Unpacking a tuple and asserting on part of it is ordinary test style.
"tests/*" = ["RUF059"]

[tool.coverage.run]
source = ["namazu"]
branch = true

[tool.coverage.report]
# No threshold yet. The number is here to show which checks have no test
# behind them, not to fail a build on a round figure.
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
